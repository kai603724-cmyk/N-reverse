name: Nubank Flutter Reverse Engineering

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to Nubank base.apk (ARM64 variant)'
        required: true
        type: string
      split_arm64_url:
        description: 'Direct URL to split_config.arm64_v8a.apk'
        required: true
        type: string
      split_xxxhdpi_url:
        description: 'Direct URL to split_config.xxxhdpi.apk'
        required: true
        type: string

jobs:
  reverse:
    name: Reverse Engineering on macOS ARM64 (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write

    env:
      ANDROID_HOME: /usr/local/share/android-sdk

    steps:
      # ──────────────────────────────────────────────
      # SYSTEM DEPENDENCIES (macOS)
      # ──────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          brew update
          brew install python3 wget unzip curl jq git
          java -version
          python3 --version

      # ──────────────────────────────────────────────
      # ANDROID SDK via setup-android (correct inputs for v3)
      # ──────────────────────────────────────────────
      - name: Setup Android SDK with emulator
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2
            system-images;android-33;google_apis_playstore;arm64-v8a
            emulator
            ndk;26.1.10909125

      - name: Verify Android SDK installation
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/
          ls -la $ANDROID_HOME/emulator/
          ls -la $ANDROID_HOME/platform-tools/
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed | grep -E "emulator|system-images|platform-tools"

      # ──────────────────────────────────────────────
      # CREATE AND BOOT ARM64 AVD (native on Apple Silicon)
      # ──────────────────────────────────────────────
      - name: Create AVD
        run: |
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd \
            -n pixel6_arm64 \
            -k "system-images;android-33;google_apis_playstore;arm64-v8a" \
            --device "pixel_6" \
            --force
          echo "AVD created"

      - name: Start emulator with logging
        run: |
          # Start emulator with verbose logging
          nohup $ANDROID_HOME/emulator/emulator \
            -avd pixel6_arm64 \
            -no-snapshot-load \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-window \
            -accel on \
            -verbose > emulator.log 2>&1 &
          
          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"
          echo "Waiting for emulator to start..."
          
          # Wait for adb to appear
          for i in {1..120}; do
            if adb devices | grep -q "emulator"; then
              echo "ADB connected at attempt $i"
              break
            fi
            sleep 5
            if [ $i -eq 120 ]; then
              echo "TIMEOUT: Emulator didn't start"
              cat emulator.log
              exit 1
            fi
          done

      - name: Wait for boot completed
        run: |
          echo "Waiting for boot completed..."
          for i in {1..240}; do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then
              echo "Boot completed at attempt $i"
              break
            fi
            sleep 5
            if [ $i -eq 240 ]; then
              echo "TIMEOUT: Boot not completed"
              adb shell getprop sys.boot_completed
              cat emulator.log
              exit 1
            fi
          done
          
          # Verify ARM64
          ABI=$(adb shell getprop ro.product.cpu.abi 2>/dev/null | tr -d '\r')
          echo "Device ABI: $ABI"
          if [ "$ABI" != "arm64-v8a" ]; then
            echo "ERROR: Not ARM64! ABI=$ABI"
            exit 1
          fi
          
          # Hidden API policy
          adb shell settings put global hidden_api_policy_pre_p_apps 1
          adb shell settings put global hidden_api_policy_p_apps 1
          adb shell settings put global hidden_api_policy 1
          
          echo "Device ready!"
          adb shell getprop ro.product.model
          adb shell getprop ro.build.version.release

      # ──────────────────────────────────────────────
      # DOWNLOAD NUBANK APK
      # ──────────────────────────────────────────────
      - name: Download Nubank APK splits
        env:
          BASE_URL: ${{ github.event.inputs.apk_url }}
          SPLIT_ARM64_URL: ${{ github.event.inputs.split_arm64_url }}
          SPLIT_XXXHDPI_URL: ${{ github.event.inputs.split_xxxhdpi_url }}
        run: |
          wget -q "$BASE_URL" -O base.apk
          wget -q "$SPLIT_ARM64_URL" -O split_config.arm64_v8a.apk
          wget -q "$SPLIT_XXXHDPI_URL" -O split_config.xxxhdpi.apk
          
          ls -la *.apk
          file base.apk

      # ──────────────────────────────────────────────
      # REFLUTTER REPACK
      # ──────────────────────────────────────────────
      - name: Install reFlutter
        run: |
          pip3 install reflutter

      - name: Repack with reFlutter (JIT + debug)
        run: |
          reflutter base.apk
          ls -la base.reflutter.apk

      # ──────────────────────────────────────────────
      # INSTALL REPACKED APK
      # ──────────────────────────────────────────────
      - name: Install repacked APK with splits
        run: |
          adb install-multiple base.reflutter.apk split_config.arm64_v8a.apk split_config.xxxhdpi.apk
          adb shell pm list packages | grep nubank

      # ──────────────────────────────────────────────
      # START FRIDA SERVER
      # ──────────────────────────────────────────────
      - name: Download and start Frida server
        run: |
          FRIDA_VERSION="16.5.6"
          wget -q "https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/frida-server-${FRIDA_VERSION}-android-arm64.xz" -O frida-server.xz
          xz -d frida-server.xz
          chmod +x frida-server
          adb root
          adb push frida-server /data/local/tmp/frida-server
          adb shell "/data/local/tmp/frida-server &"
          sleep 3
          adb shell "ps | grep frida-server"

      # ──────────────────────────────────────────────
      # INSTALL FRIDA-TOOLS AND FLUTTER HOOKS
      # ──────────────────────────────────────────────
      - name: Install Frida tools and frida-flutter
        run: |
          pip3 install frida-tools
          git clone https://github.com/dorneanu/frida-flutter /tmp/frida-flutter
          cd /tmp/frida-flutter && pip3 install -e .

      # ──────────────────────────────────────────────
      # DUMP WIDGET TREE - LOGIN SCREEN (ROBUST)
      # ──────────────────────────────────────────────
      - name: Create Frida dump script
        run: |
          cat > /tmp/dump_widget_tree.js << 'EOF'
          Java.perform(async () => {
            console.log("[*] Starting Flutter widget tree dump...");
            
            try {
              const Flutter = require('frida-flutter');
              
              await Flutter.waitForFlutter();
              console.log("[*] Flutter engine found");
              
              const tree = await Flutter.getWidgetTree();
              console.log("[*] Widget tree retrieved, nodes:", tree?.length || 0);
              
              const loginWidgets = Flutter.findWidgets(tree, (w) => {
                const name = w.type || w.className || '';
                return name.toLowerCase().includes('login') || 
                       name.toLowerCase().includes('password') ||
                       name.toLowerCase().includes('senha') ||
                       name.toLowerCase().includes('pin') ||
                       name.toLowerCase().includes('passcode');
              });
              
              console.log("[*] Login-related widgets:", JSON.stringify(loginWidgets, null, 2));
              
              let colorScheme = null, textStyles = null, constraints = null;
              try { colorScheme = await Flutter.getColorScheme(); } catch (e) { console.log("[!] getColorScheme failed:", e.message); }
              try { textStyles = await Flutter.getTextStyles(); } catch (e) { console.log("[!] getTextStyles failed:", e.message); }
              try { constraints = await Flutter.getConstraints(); } catch (e) { console.log("[!] getConstraints failed:", e.message); }
              
              const fullDump = {
                timestamp: Date.now(),
                widgetTree: tree,
                loginWidgets: loginWidgets,
                colorScheme: colorScheme,
                textStyles: textStyles,
                constraints: constraints,
              };
              
              const fs = require('fs');
              const path = '/data/local/tmp/widget_tree_dump.json';
              fs.writeFileSync(path, JSON.stringify(fullDump, null, 2));
              console.log("[*] Dump written to", path);
              
            } catch (e) {
              console.log("[ERROR] Frida dump failed:", e.message, e.stack);
              const fs = require('fs');
              const fallback = { timestamp: Date.now(), error: e.message, stack: e.stack };
              fs.writeFileSync('/data/local/tmp/widget_tree_dump.json', JSON.stringify(fallback, null, 2));
            }
          });
          setTimeout(() => {}, 60000);
          EOF

      - name: Run Frida dump on Nubank app
        run: |
          adb shell am force-stop br.com.nubank
          sleep 2
          
          echo "Starting Frida dump..."
          frida -U -f br.com.nubank -l /tmp/dump_widget_tree.js --no-pause -o frida_output.log &
          FRIDA_PID=$!
          
          sleep 50
          
          kill $FRIDA_PID 2>/dev/null || true
          
          echo "Pulling dump..."
          adb pull /data/local/tmp/widget_tree_dump.json ./widget-tree-exact.json
          
          if [ -f ./widget-tree-exact.json ]; then
            echo "Widget tree dump successful"
            head -c 5000 ./widget-tree-exact.json
          else
            echo "Dump not found, checking frida output"
            cat frida_output.log
            exit 1
          fi

      # ──────────────────────────────────────────────
      # TAKE SCREENSHOTS OF LOGIN STATES
      # ──────────────────────────────────────────────
      - name: Take screenshots (clean, filled, error)
        run: |
          mkdir -p screenshots
          
          adb shell am force-stop br.com.nubank
          sleep 1
          adb shell am start -n br.com.nubank/.MainActivity
          sleep 8
          
          # Screenshot 1: Clean state
          adb shell screencap -p /sdcard/clean.png
          adb pull /sdcard/clean.png ./screenshots/clean.png
          
          # Interact for error state
          adb shell input tap 540 1200
          sleep 1
          adb shell input text "000000"
          sleep 1
          adb shell input keyevent 66
          sleep 4
          adb shell screencap -p /sdcard/error.png
          adb pull /sdcard/error.png ./screenshots/error.png
          
          # Screenshot 3: Filled state
          adb shell am force-stop br.com.nubank
          sleep 1
          adb shell am start -n br.com.nubank/.MainActivity
          sleep 8
          adb shell input tap 540 1200
          sleep 1
          adb shell input text "123456"
          sleep 1
          adb shell screencap -p /sdcard/filled.png
          adb pull /sdcard/filled.png ./screenshots/filled.png
          
          ls -la screenshots/

      # ──────────────────────────────────────────────
      # EXTRACT COLOR SCHEME, FONTS, CONSTRAINTS
      # ──────────────────────────────────────────────
      - name: Extract detailed Flutter properties
        run: |
          cat > /tmp/extract_details.js << 'EOF'
          const Flutter = require('frida-flutter');
          
          Java.perform(async () => {
            try {
              await Flutter.waitForFlutter();
              
              const details = {};
              try { details.colorScheme = await Flutter.getColorScheme(); } catch (e) { details.colorSchemeError = e.message; }
              try { details.textStyles = await Flutter.getTextStyles(); } catch (e) { details.textStylesError = e.message; }
              try { details.constraints = await Flutter.getConstraints(); } catch (e) { details.constraintsError = e.message; }
              try { details.animations = await Flutter.getAnimations(); } catch (e) { details.animationsError = e.message; }
              try { details.theme = await Flutter.getThemeData(); } catch (e) { details.themeError = e.message; }
              
              const fs = require('fs');
              fs.writeFileSync('/data/local/tmp/flutter_details.json', JSON.stringify(details, null, 2));
              console.log("[*] Details extracted");
            } catch (e) {
              console.log("[ERROR] Details extraction failed:", e.message);
              const fs = require('fs');
              fs.writeFileSync('/data/local/tmp/flutter_details.json', JSON.stringify({error: e.message}, null, 2));
            }
          });
          setTimeout(() => {}, 30000);
          EOF
          
          adb shell am force-stop br.com.nubank
          sleep 1
          
          frida -U -f br.com.nubank -l /tmp/extract_details.js --no-pause -o details.log &
          sleep 30
          kill %1 2>/dev/null || true
          
          adb pull /data/local/tmp/flutter_details.json ./color-scheme.json 2>/dev/null || echo "Details not extracted"
          
          adb shell "pm dump br.com.nubank" > ./package_dump.txt 2>/dev/null || true

      # ──────────────────────────────────────────────
      # UPLOAD ARTIFACTS
      # ──────────────────────────────────────────────
      - name: Upload widget tree
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widget-tree-exact
          path: |
            widget-tree-exact.json
            widget-tree-exact.json.*
          retention-days: 7

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7

      - name: Upload color scheme and details
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: color-scheme
          path: |
            color-scheme.json
            flutter_details.json
            package_dump.txt
          retention-days: 7

      - name: Upload Frida logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frida-logs
          path: |
            frida_output.log
            details.log
            emulator.log
          retention-days: 7
